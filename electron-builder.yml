appId: com.gptimage.playground
productName: GPT Image Playground
asar: true
electronDownload:
  cache: .electron-cache
directories:
  output: electron-dist
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.test.*'
  - '!**/.env*'
  - '!**/dev-proxy.config.json'
  - '!**/gpt-image-config.local.json'
  - '!electron/desktop-config.json'
win:
  target:
    - portable
    - nsis
  artifactName: '${productName}-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: '${productName}-${version}-portable.${ext}'
